# Ambiente de produção: backend compilado + frontend servido pelo nginx.
# Requer um arquivo .env na raiz com DB_PASSWORD e JWT_SECRET (veja .env.prod.example).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-jobhunter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      POSTGRES_DB: ${DB_NAME:-jobhunter}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: production
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-jobhunter}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      DB_NAME: ${DB_NAME:-jobhunter}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      UPLOAD_DIR: /app/storage/curriculos
      N8N_ATS_WEBHOOK_URL: ${N8N_ATS_WEBHOOK_URL:?Defina N8N_ATS_WEBHOOK_URL no .env}
      N8N_SEARCH_JOBS_WEBHOOK_URL: ${N8N_SEARCH_JOBS_WEBHOOK_URL:?Defina N8N_SEARCH_JOBS_WEBHOOK_URL no .env}
      INTERVIEW_AUDIO_DIR: /app/storage/entrevistas
      N8N_INTERVIEW_WEBHOOK_URL: ${N8N_INTERVIEW_WEBHOOK_URL:-}
    volumes:
      - curriculos:/app/storage/curriculos
      - entrevistas:/app/storage/entrevistas
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
  curriculos:
  entrevistas:
