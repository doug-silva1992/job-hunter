# Ambiente de desenvolvimento (hot reload)
services:
  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      TSC_WATCHFILE: DynamicPriorityPolling
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:3000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
