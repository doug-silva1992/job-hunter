# Ambiente de desenvolvimento (hot reload)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter
      POSTGRES_DB: jobhunter
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter -d jobhunter"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      TSC_WATCHFILE: DynamicPriorityPolling
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: jobhunter
      DB_PASSWORD: jobhunter
      DB_NAME: jobhunter
      # segredo apenas para desenvolvimento; em produção use um valor aleatório
      JWT_SECRET: dev-only-secret-change-me
      JWT_EXPIRES_IN: 1d
      UPLOAD_DIR: storage/curriculos
      # n8n rodando na máquina host (fora deste compose)
      N8N_ATS_WEBHOOK_URL: http://host.docker.internal:5678/webhook/ats-check
      N8N_SEARCH_JOBS_WEBHOOK_URL: http://host.docker.internal:5678/webhook/search-jobs
      INTERVIEW_AUDIO_DIR: storage/entrevistas
      N8N_INTERVIEW_WEBHOOK_URL: http://host.docker.internal:5678/webhook/interview_training
      N8N_INTERVIEW_WEBHOOK_TIMEOUT_MS: "180000"
      N8N_PREPARATION_WEBHOOK_URL: http://host.docker.internal:5678/webhook/interview-prep
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:3000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
