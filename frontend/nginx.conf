server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # currículos de até 5 MB e os 4 áudios da entrevista (até 5 MB cada); o padrão do nginx é 1 MB
  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # a avaliação da entrevista pelo n8n/Gemini pode levar alguns minutos
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
